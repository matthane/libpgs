[package]
name = "libpgs"
version = "0.6.0"
edition = "2024"
description = "PGS subtitle extraction, encoding, and round-trip transformation for MKV and M2TS containers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matthane/libpgs"
homepage = "https://github.com/matthane/libpgs"
documentation = "https://docs.rs/libpgs"
readme = "README.md"
keywords = ["pgs", "subtitles", "mkv", "m2ts", "bluray"]
categories = ["multimedia::video", "multimedia::encoding", "parser-implementations", "command-line-utilities"]

[lib]
name = "libpgs"
path = "src/lib.rs"

[[bin]]
name = "libpgs"
path = "src/cli/main.rs"

[dependencies]
flate2 = "1"
